
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Approval System</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Invoice Approval System</h1>
    <div id="userInfo" hidden>
      <span id="loggedInUser"></span>
      <button id="logoutButton">Logout</button>
    </div>
  </header>

  <main>
    <section id="loginSection" class="panel">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="username">Username</label>
        <select id="username" required>
          <option value="manager">Manager</option>
          <option value="director">Director</option>
          <option value="director2">Second Director</option>
        </select>

        <label for="password">Password</label>
        <input id="password" type="password" required />

        <button type="submit">Login</button>
      </form>
      <p id="loginMessage" class="message"></p>
      <p class="hint">Demo passwords: manager123 / director123</p>
    </section>

    <section id="dashboardSection" hidden>
      <section class="panel">
        <h2>Create Invoice</h2>
        <form id="invoiceForm">
          <label for="amount">Invoice Amount</label>
          <input
            id="amount"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="Enter invoice amount"
            required
          />
          <button type="submit">Create Invoice</button>
        </form>
        <p id="invoiceMessage" class="message"></p>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h2>Invoices</h2>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
        <div id="invoiceList"></div>
      </section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
